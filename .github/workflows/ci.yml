name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only by default, override per-job where needed
permissions:
  contents: read

# Cancel superseded runs on same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.9.18"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y openslide-tools

      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        if: matrix.python-version == '3.12'
        run: uv run ruff format --check .

      - name: Lint
        if: matrix.python-version == '3.12'
        run: uv run ruff check .

      - name: Type check
        if: matrix.python-version == '3.12'
        run: uv run mypy src

      - name: Test
        if: matrix.python-version != '3.12'
        run: uv run pytest -m "not integration and not live and not cost"

      - name: Test with coverage
        if: matrix.python-version == '3.12'
        run: uv run pytest -m "not integration and not live and not cost" --cov=src/giant --cov-report=xml --cov-fail-under=90

      - name: Build docs (strict)
        if: matrix.python-version == '3.12'
        run: uv run mkdocs build --strict --site-dir /tmp/mkdocs-site

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false # Token required for protected branches; set CODECOV_TOKEN secret to enable

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: read-all
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
